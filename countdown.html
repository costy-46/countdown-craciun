<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Până la Crăciun</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1b2a24 0%, #0d151a 65%, #090d12 100%);
      color: #ffffff;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 20px;
    }

    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .flake {
      position: absolute;
      top: -12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-12px) translateX(0);
      }
      50% {
        transform: translateY(50vh) translateX(10px);
      }
      100% {
        transform: translateY(105vh) translateX(-10px);
      }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fcd34d;
      background: rgba(20, 83, 45, 0.45);
      border: 1px solid rgba(252, 211, 77, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
    }

    .title {
      font-size: 36px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.4px;
      color: #fffbeb;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .countdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .unit {
      background: #17222b;
      border: 1.5px solid rgba(251, 191, 36, 0.28);
      border-radius: 16px;
      padding: 18px 22px;
      min-width: 108px;
      text-align: center;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .unit:nth-child(odd) {
      border-top: 3px solid #ef4444;
    }

    .unit:nth-child(even) {
      border-top: 3px solid #22c55e;
    }

    .value {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.05;
      color: #ff4d5a;
      font-variant-numeric: tabular-nums;
    }

    .unit:nth-child(even) .value {
      color: #fbbf24;
    }

    .label {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #e2e8f0;
    }

    .footer-note {
      margin-top: 4px;
      font-size: 13px;
      color: #cbd5e1;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <div class="snow" id="snow"></div>

  <div class="wrapper">
    <div class="badge">🎄 Sezonul de Iarnă</div>
    <div class="title">Până la Crăciun</div>

    <div class="countdown">
      <div class="unit">
        <div class="value" id="days">00</div>
        <div class="label">Zile</div>
      </div>
      <div class="unit">
        <div class="value" id="hours">00</div>
        <div class="label">Ore</div>
      </div>
      <div class="unit">
        <div class="value" id="minutes">00</div>
        <div class="label">Minute</div>
      </div>
      <div class="unit">
        <div class="value" id="seconds">00</div>
        <div class="label">Secunde</div>
      </div>
    </div>

    <div class="footer-note">25 Decembrie 2026</div>
  </div>

  <script>
    const targetDate = new Date("2026-12-25T00:00:00").getTime();

    function renderCountdown() {
      const now = Date.now();
      const distance = Math.max(0, targetDate - now);

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    function createSnowflakes() {
      const snowContainer = document.getElementById("snow");
      const count = 28;

      for (let i = 0; i < count; i++) {
        const flake = document.createElement("span");
        flake.className = "flake";
        const size = Math.random() * 4 + 2;
        flake.style.width = `${size}px`;
        flake.style.height = `${size}px`;
        flake.style.left = `${Math.random() * 100}%`;
        flake.style.opacity = (Math.random() * 0.5 + 0.25).toFixed(2);
        flake.style.animationDuration = `${Math.random() * 8 + 7}s`;
        flake.style.animationDelay = `${Math.random() * 8}s`;
        snowContainer.appendChild(flake);
      }
    }

    renderCountdown();
    createSnowflakes();
    setInterval(renderCountdown, 1000);
  </script>
</body>
</html>
